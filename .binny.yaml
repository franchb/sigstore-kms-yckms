tools:
  - name: binny
    version:
      want: v0.11.1
    method: github-release
    with:
      repo: anchore/binny

  - name: task
    version:
      want: v3.46.4
    method: github-release
    with:
      repo: go-task/task

  - name: golangci-lint
    version:
      want: v2.9.0
    method: github-release
    with:
      repo: golangci/golangci-lint

  - name: govulncheck
    version:
      want: latest
      method: go-proxy
      with:
        module: golang.org/x/vuln
        allow-unresolved-version: true
    method: go-install
    with:
      entrypoint: cmd/govulncheck
      module: golang.org/x/vuln

  - name: betteralign
    version:
      want: latest
      method: go-proxy
      with:
        module: github.com/dkorunic/betteralign
        allow-unresolved-version: true
    method: go-install
    with:
      entrypoint: cmd/betteralign
      module: github.com/dkorunic/betteralign

  - name: gosimports
    version:
      want: v0.3.8
    method: github-release
    with:
      repo: rinchsan/gosimports
