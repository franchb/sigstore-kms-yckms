version: 2

builds:
  - main: ./cmd/sigstore-kms-yckms
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64

archives:
  - format: binary
    name_template: '{{ .Binary }}'

checksum:
  name_template: '{{ .ProjectName }}_{{.Version}}_checksums.txt'
  algorithm: sha256

snapshot:
  name_template: '{{ .ProjectName }}_next'
