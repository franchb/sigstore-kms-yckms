version: 2
updates:
  - package-ecosystem: "gomod"
    commit-message:
      prefix: "chore(deps)"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      # go-sdk pins an exact go-genproto release; bumped apart, one of the two
      # PRs fails to compile (seen with go-genproto 0.125.0 vs go-sdk 0.33.0).
      yandex-cloud:
        patterns:
          - "github.com/yandex-cloud/*"
    ignore:
      # go-genproto >= 0.132.0 dropped dataproc/v1/change_freeze_service_grpc.pb.go,
      # so go-sdk fails to compile against it. Remove once fixed upstream:
      # https://github.com/yandex-cloud/go-sdk/issues/54
      - dependency-name: "github.com/yandex-cloud/go-genproto"
        versions: [">= 0.132.0"]
      # Every go-sdk release from 0.42.0 on requires go-genproto >= 0.133.0,
      # so a go-sdk bump drags the broken go-genproto in transitively.
      - dependency-name: "github.com/yandex-cloud/go-sdk"
        versions: [">= 0.42.0"]

  - package-ecosystem: "github-actions"
    commit-message:
      prefix: "chore(deps)"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    commit-message:
      prefix: "chore(deps)"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
