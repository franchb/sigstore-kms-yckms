version: 2
updates:
  - package-ecosystem: "gomod"
    commit-message:
      prefix: "chore(deps)"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      # go-sdk pins an exact go-genproto release; bumped apart, one of the two
      # PRs fails to compile (seen with go-genproto 0.125.0 vs go-sdk 0.33.0).
      yandex-cloud:
        patterns:
          - "github.com/yandex-cloud/*"

  - package-ecosystem: "github-actions"
    commit-message:
      prefix: "chore(deps)"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    commit-message:
      prefix: "chore(deps)"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
