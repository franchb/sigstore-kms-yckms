name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Bootstrap Go modules
        run: make ci-bootstrap-go

      - name: Run check-ci
        run: make check-ci

  semver:
    name: Determine version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semver.outputs.version }}
      changelog: ${{ steps.semver.outputs.changelog }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Dry-run: compute the next version and write it to outputs without
      # creating a GitHub Release. A published empty release is immutable,
      # so GoReleaser cannot append archives afterwards.
      - name: Run go-semantic-release
        id: semver
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f # v1.24.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          allow-initial-development-versions: true
          dry: "true"

      - name: Create version tag
        if: steps.semver.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.semver.outputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "/repos/${REPO}/git/refs" \
            -f ref="refs/tags/v${VERSION}" \
            -f sha="${SHA}"

  goreleaser:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: semver
    if: needs.semver.outputs.version != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: v${{ needs.semver.outputs.version }}
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Write release notes
        env:
          NOTES: ${{ needs.semver.outputs.changelog }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: printf '%s\n' "$NOTES" > "$NOTES_FILE"

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.17.1 # keep in sync with .binny.yaml
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A leftover tag with no published assets makes the next run skip this
      # version (semantic-release treats the tag as already released).
      - name: Delete version tag if GoReleaser failed
        if: failure() && steps.goreleaser.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.semver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete "v${VERSION}" --yes --cleanup-tag || \
            gh api --method DELETE "/repos/${REPO}/git/refs/tags/v${VERSION}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*_checksums.txt
